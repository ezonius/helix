# Helix configuration - GENERATED FILE, do not edit.
# Edit the fragments in keys/*.toml, then run:
#     ./build-config.sh      (Linux/macOS)
#     .\build-config.ps1     (Windows)
# and reload with :config-reload inside Helix.
# generated for platform: windows

theme = "dark-synthwave"

[editor]
default-yank-register = "+"

[editor.cursor-shape]
insert = "bar"

[keys.normal]
i = "move_visual_line_up"
j = "move_char_left"
k = "move_visual_line_down"
a = "insert_mode"
h = "append_mode"
S-a = "insert_at_line_start"
S-h = "insert_at_line_end"
C-s = ":w" # Replace save jumplist with save file
C-q = "save_selection" # Previously C-s
A-left = "jump_backward"
A-right = "jump_forward"
C-i = "no_op" # Remove old jump_forward
C-o = "no_op" # Remove old jump_backward
ret = ["open_below", "normal_mode"]
S-ret = ["open_above", "normal_mode"]
o = "no_op" # old open_below
O = "keep_selections" # old open_above
backspace = ["move_char_left", "delete_selection_noyank"]
A-up = ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before"]
A-down = ["extend_to_line_bounds", "delete_selection", "paste_after"]
C-up = "@z10<up>10<up>"
C-down = "@z10<down>10<down>"
S-left = ["select_mode", "move_prev_long_word_start"]
S-right = ["select_mode", "move_next_long_word_start"]
S-home = ["select_mode", "goto_line_start"]
S-end = ["select_mode", "goto_line_end"]

[keys.select]
C-up = "@z10<up>10<up>"
C-down = "@z10<down>10<down>"
S-home = ["goto_line_start"]
S-end = ["goto_line_end"]

[keys.insert]
C-up = "@<esc>z10<up>"
C-down = "@<esc>z10<down>"

[editor.whitespace.render]
newline = "all"
space = "none"
tab = "all"

[editor.whitespace.characters]
newline = "⏎"
tab = "→"
space = "·"

[keys.normal.g]
i = "move_line_up"
j = "goto_line_start"
k = "move_line_down"
h = "goto_implementation"

[keys.normal.C-w]
i = "jump_view_up"
k = "jump_view_down"
j = "jump_view_left"
C-i = "jump_view_up"
C-k = "jump_view_down"
C-j = "jump_view_left"
S-j = "swap_view_left"
S-i = "swap_view_up"
S-k = "swap_view_down"
h = "no_op"
S-h = "no_op"

[keys.normal.space]
space = "command_palette"
";" = "toggle_comments"
B = [":echo %sh{powershell -NoProfile -ExecutionPolicy Bypass -File %%APPDATA%%\\helix\\build-config.ps1}", ":config-reload"]

[keys.normal.space.w]
i = "jump_view_up"
k = "jump_view_down"
j = "jump_view_left"
C-i = "jump_view_up"
C-k = "jump_view_down"
C-j = "jump_view_left"
S-j = "swap_view_left"
S-i = "swap_view_up"
S-k = "swap_view_down"
h = "no_op"
S-h = "no_op"
