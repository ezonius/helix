# Line handling (vimrc: <Enter> = o<Esc>, x = "_x, <BS> = "_h<Delete>)
#
# Displaces: x = extend_line_below (use `X` instead), ret/backspace (unbound).

[keys.normal]
ret = ["open_below", "normal_mode"]
"S-ret" = ["open_above", "normal_mode"]
"o" = "no_op" # old open_below
"O" = "keep_selections" # old open_above
# x = "delete_selection_noyank"
backspace = ["move_char_left", "delete_selection_noyank"]



