# Scroll + jump to end of line ("M$" in the vimrc).
#
# Currently only in select and insert mode - the [keys.normal] block was
# commented out in the hand-written config. Add a [keys.normal] block here to
# re-enable C-i/C-k/C-up/C-down/S-up/S-down there (displaces C-i = jump_forward).

[keys.normal]
"C-up" = "@z10<up>10<up>"
"C-down" = "@z10<down>10<down>"

[keys.select]
"C-up" = "@z10<up>10<up>"
"C-down" = "@z10<down>10<down>"

[keys.insert]
"C-up" = "@<esc>z10<up>"
"C-down" = "@<esc>z10<down>"
