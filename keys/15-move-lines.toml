# Move the current line up / down (Alt-up, Alt-down). Not from the vimrc.
#
# Displaces: A-up = expand_selection (syntax tree), A-down = shrink_selection.

[keys.normal]
"A-up" = ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before"]
"A-down" = ["extend_to_line_bounds", "delete_selection", "paste_after"]
